baseURL = "https://www.wpclawai.com/"
title = "The Velvet Notes"
theme = "PaperMod"
paginate = 10
defaultContentLanguage = "en"
languageCode = "en-us"

[params]
  env = "production"
  title = "The Velvet Notes"
  description = "Honest, judgment-free guides to sex toys, pleasure and relationships, written for real people."
  mainSections = ["guides", "pleasure", "relationships", "gift-guides", "ask", "stories"]
  disableThemeToggle = true
  author = "The Velvet Notes Editorial"
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "The Velvet Notes"
    Content = "Honest, judgment-free guides to sex toys, pleasure and relationships, written for real people."

  [params.assets]
    favicon = "/favicon.ico"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "guides"
    name = "Toy Guides"
    url = "/guides/"
    weight = 10
  [[menu.main]]
    identifier = "pleasure"
    name = "Sex & Pleasure"
    url = "/pleasure/"
    weight = 20
  [[menu.main]]
    identifier = "relationships"
    name = "Relationships"
    url = "/relationships/"
    weight = 30
  [[menu.main]]
    identifier = "gift-guides"
    name = "Gift Ideas"
    url = "/gift-guides/"
    weight = 40
  [[menu.main]]
    identifier = "ask"
    name = "Ask Velvet"
    url = "/ask/"
    weight = 50
  [[menu.main]]
    identifier = "toy-finder"
    name = "Find Your Toy"
    url = "/toy-finder/"
    weight = 60

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
