baseURL = "https://wpclawai.com/"
title = "The Velvet Notes"
theme = "PaperMod"
paginate = 10
defaultContentLanguage = "en"
languageCode = "en-us"

[params]
  env = "production"
  title = "The Velvet Notes"
  description = "Thoughtful essays, personal stories, and honest guides on intimacy, modern relationships, and self-discovery."
  author = "The Velvet Notes Editorial"
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "The Velvet Notes"
    Content = "A quiet corner for honest conversations about intimacy, thoughtful gifts, self-care, and modern connections. Written with warmth, discretion, and care."

  [params.assets]
    favicon = "/favicon.ico"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "stories"
    name = "Stories"
    url = "/stories/"
    weight = 10

  [[menu.main]]
    identifier = "guides"
    name = "Guides"
    url = "/guides/"
    weight = 20

  [[menu.main]]
    identifier = "gift-guides"
    name = "Gift Guides"
    url = "/gift-guides/"
    weight = 30

  [[menu.main]]
    identifier = "relationships"
    name = "Relationships"
    url = "/relationships/"
    weight = 40

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
