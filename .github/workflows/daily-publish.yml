name: Publish scheduled articles

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/New_York
    - cron: '30 6 * * *'
      timezone: America/New_York
    - cron: '0 8 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velvet-notes-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild Vercel production site
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Missing VERCEL_DEPLOY_HOOK secret'; exit 1; }
          curl --fail-with-body --silent --show-error --retry 2 --connect-timeout 20 --max-time 60 --request POST "$DEPLOY_HOOK"
