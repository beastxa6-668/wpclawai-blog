{{- $url := .Destination -}}
{{- if and (hasPrefix $url "/") (not (hasPrefix $url "//")) (not (hasPrefix $url "/blog/")) -}}
  {{- $url = strings.TrimPrefix "/" $url | relURL -}}
{{- end -}}
<a href="{{ $url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
{{- /* 末尾不留换行：否则每个链接后的逗号、句号前会多一个空格 */ -}}
