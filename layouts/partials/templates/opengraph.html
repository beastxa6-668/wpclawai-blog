<meta property="og:url" content="{{ .Permalink }}"><meta property="og:site_name" content="SinDept · The Velvet Notes"><meta property="og:title" content="{{ .Title | default site.Title }}"><meta property="og:description" content="{{ .Description | default .Summary | default site.Params.description | plainify }}"><meta property="og:locale" content="en_US"><meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">{{ with .Params.cover.image }}<meta property="og:image" content="{{ strings.TrimPrefix "/" . | absURL }}">{{ end }}
